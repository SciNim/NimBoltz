# Bitwise equivalence with the reference Fortran build (gfortran -O0
# -ffp-contract=off): no FMA contraction, no fast-math, and keep math-errno.
# Nim's default `gcc.options.speed` adds -fno-math-errno, which lets GCC
# rewrite libm calls (e.g. sin(atan(x))) and changes results by an ulp.
# Read for every project file below this directory; bounds checks stay on
# in release builds.
gcc.options.speed = "-O3 -fno-ident"
clang.options.speed = "-O3"
passC:"-ffp-contract=off"
